name: Cross-browser tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to test, or all three browsers
        required: true
        type: choice
        default: all
        options:
          - all
          - chromium
          - firefox
          - webkit

jobs:
  cucumber:
    name: Cucumber (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: ${{ inputs.browser == 'all' && fromJSON('["chromium","firefox","webkit"]') || fromJSON(format('["{0}"]', inputs.browser)) }}
    env:
      BROWSER: ${{ matrix.browser }}
      LOG_LEVEL: INFO
      LOG_TO_FILE: 'true'
      SCREENSHOT_MODE: only-on-failure
      TRACE_MODE: retain-on-failure
      VIDEO_MODE: off
      CUCUMBER_HTML_REPORT: reports/cucumber/report-${{ matrix.browser }}.html
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install selected Playwright browser
        run: npx playwright install --with-deps "$BROWSER"

      - name: Run Cucumber tests and create browser-specific HTML report
        id: cucumber-tests
        run: npm run test:cucumber:retry

      - name: Generate Allure HTML report
        if: always() && steps.cucumber-tests.outcome != 'skipped'
        run: npm run report:allure

      - name: Upload browser-specific reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.browser }}-reports
          path: |
            reports/cucumber/report-${{ matrix.browser }}.html
            reports/traces/
            reports/screenshots/
            reports/videos/
            reports/allure-report/
            allure-results/
          if-no-files-found: warn

      - name: Upload logs after a failed test run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.browser }}-logs
          path: artifacts/logs/
          if-no-files-found: warn
